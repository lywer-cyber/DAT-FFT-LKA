# Sealed test of the best validation-PSNR checkpoint from original DAT + FFT.
name: hologram_DAT_x4_fft_test
model_type: DATModel
scale: 4
num_gpu: auto
manual_seed: 2026
allow_tf32: true

datasets:
  test:
    name: hologram_x4_test
    type: HologramIntensityDataset
    dataroot: /root/autodl-tmp/real_hologram_x4
    dataset_protocol: lab_like
    target_dir: hologram_clean
    gt_size: ~
    use_hflip: false
    use_rot: false
    num_worker_per_gpu: 0
    batch_size_per_gpu: 1

network_g:
  type: DAT
  upscale: 4
  in_chans: 1
  img_size: 64
  img_range: 1.
  split_size: [8, 32]
  depth: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  expansion_factor: 4
  resi_connection: '1conv'
  upsampler: pixelshuffle
  use_chk: false
  use_bicubic_residual: true
  zero_init_residual_tail: true

path:
  pretrain_network_g: experiments/hologram_DAT_x4_fft_30ep/models/net_g_best_val_psnr.pth
  param_key_g: params_ema
  strict_load_g: true

val:
  save_img: false
  suffix: ~
  empty_cuda_cache: false
  hologram_float_metrics: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false
    mae:
      type: calculate_mae
      crop_border: 4
      better: lower
    rmse:
      type: calculate_rmse
      crop_border: 4
      better: lower
    spectral_corr:
      type: calculate_hologram_spectral_corr
      crop_border: 4
      min_radius: 0.15
      max_radius: 0.5
      better: higher
    hf_spectral_mae:
      type: calculate_hologram_hf_mae
      crop_border: 4
      min_radius: 0.15
      max_radius: 0.5
      better: lower

deterministic_training: true
